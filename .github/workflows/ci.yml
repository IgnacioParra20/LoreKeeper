name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lorekeeper_test
          POSTGRES_USER: lorekeeper
          POSTGRES_PASSWORD: lorekeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lorekeeper -d lorekeeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lorekeeper:lorekeeper_test@localhost:5432/lorekeeper_test?schema=public
      TEST_DATABASE_URL: postgresql://lorekeeper:lorekeeper_test@localhost:5432/lorekeeper_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
